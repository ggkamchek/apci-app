services:
  postgres:
    image: postgres:16-alpine
    container_name: platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform}
      POSTGRES_DB: ${POSTGRES_DB:-platform}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform} -d ${POSTGRES_DB:-platform}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: platform-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_ADDR: ${SERVER_ADDR:-:8080}
      GRPC_ADDR: ${GRPC_ADDR:-:50051}
      DATABASE_URL: postgres://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD:-platform}@postgres:5432/${POSTGRES_DB:-platform}?sslmode=disable
      CHALLENGE_TTL: ${CHALLENGE_TTL:-60s}
      SESSION_TTL: ${SESSION_TTL:-24h}
      MIGRATIONS_DIR: migrations
    ports:
      - "${API_PORT:-8080}:8080"
      - "${GRPC_PORT:-50051}:50051"

  postgres-security:
    image: postgres:16-alpine
    container_name: platform-postgres-security
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SECURITY_USER:-security}
      POSTGRES_PASSWORD: ${POSTGRES_SECURITY_PASSWORD:-security}
      POSTGRES_DB: ${POSTGRES_SECURITY_DB:-security}
    ports:
      - "${POSTGRES_SECURITY_PORT:-5434}:5432"
    volumes:
      - pgdata-security:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SECURITY_USER:-security} -d ${POSTGRES_SECURITY_DB:-security}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  pgdata-security:
