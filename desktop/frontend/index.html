<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>APCI</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div id="auth-screen" class="screen">
        <div class="card">
            <h1 class="logo">APCI</h1>
            <p class="subtitle" id="auth-subtitle">Вход в аккаунт</p>

            <label class="field">
                <span>Имя пользователя</span>
                <input id="username" type="text" placeholder="например, lera" autocomplete="username" />
            </label>

            <p id="error" class="error hidden"></p>

            <button id="submit-btn" class="btn primary" type="button">Войти</button>

            <button id="toggle-mode" class="btn link" type="button">
                Нет аккаунта? Зарегистрироваться
            </button>
        </div>
    </div>

    <div id="main-screen" class="screen hidden">
        <div class="card main-card">
            <h1 class="logo">APCI</h1>
            <p class="welcome">Привет, <strong id="display-username"></strong>!</p>
            <p class="meta">ID: <span id="display-userid"></span></p>
            <p class="meta">Сессия активна</p>

            <div class="divider"></div>

            <div class="e2e">
                <p class="subtitle" style="margin-bottom: 12px;">E2E (MVP)</p>
                <p id="e2e-status" class="meta">—</p>

                <button id="e2e-init-btn" class="btn primary" type="button">E2EInit (Upload bundle)</button>

                <label class="field" style="margin-top: 14px;">
                    <span>Recipient user_id (UUID)</span>
                    <input id="e2e-recipient" type="text" list="e2e-recipients" placeholder="например, cde06a89-..." />
                    <datalist id="e2e-recipients"></datalist>
                </label>

                <div class="chips">
                    <span class="chip-label">Недавние:</span>
                    <div id="e2e-recent" class="chip-row"></div>
                </div>

                <label class="field">
                    <span>Сообщение</span>
                    <textarea id="e2e-plaintext" rows="3" placeholder="привет"></textarea>
                </label>

                <button id="e2e-send-btn" class="btn primary" type="button">Отправить</button>

                <div class="row">
                    <button id="e2e-inbox-btn" class="btn secondary" type="button">Inbox (Fetch + decrypt)</button>
                    <button id="e2e-clear-btn" class="btn secondary" type="button">Очистить</button>
                </div>

                <div id="e2e-messages" class="messages"></div>
            </div>

            <button id="logout-btn" class="btn secondary" type="button">Выйти</button>
        </div>
    </div>

    <script src="fingerprint.js"></script>
    <script src="app.js"></script>
</body>
</html>
